name: API Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Start API in background
        run: npm start &

      - name: Wait until API is running
        run: |
          echo "Waiting for API health check..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/healthcheck > /dev/null; then
              echo "API is healthy and ready for tests."
              exit 0
            fi
            echo "Attempt $i/30: API not ready yet..."
            sleep 1
          done
          echo "API failed to become healthy within 30 seconds."
          exit 1

      - name: Run API tests
        run: npm test
